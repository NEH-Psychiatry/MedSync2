name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Verify formatting
        run: python -m ruff format --check .

      - name: Type-check core logic
        run: python -m mypy medsync

      - name: Run security lint
        run: python -m bandit -q -r medsync med_sync_app.py

      - name: Run tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q medsync med_sync_app.py tests

      - name: Audit runtime dependency lock
        if: matrix.python-version == '3.12'
        run: python -m pip_audit --requirement requirements.lock

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag medsync2:ci .

      - name: Start container and verify health endpoint
        run: |
          container_id=$(docker run --detach --publish 8501:8501 medsync2:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
