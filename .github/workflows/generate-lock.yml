name: Verify dependency locks

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - requirements-dev.txt
      - requirements.lock
      - requirements-dev.lock
      - .github/workflows/generate-lock.yml
  pull_request:
    paths:
      - requirements.txt
      - requirements-dev.txt
      - requirements.lock
      - requirements-dev.lock
      - .github/workflows/generate-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify hashed locks on Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lock compiler
        run: |
          # pip-tools 7.6 imports a pip API removed in pip 26.
          python -m pip install "pip==25.3" "pip-tools==7.6.0"
          python -m pip check

      - name: Recompile runtime lock
        run: |
          python -m piptools compile             --generate-hashes             --resolver=backtracking             --output-file requirements.lock             requirements.txt

      - name: Recompile development lock
        run: |
          python -m piptools compile             --generate-hashes             --resolver=backtracking             --output-file requirements-dev.lock             requirements-dev.txt

      - name: Verify committed locks are current
        run: git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Verify hash-locked installation
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip check
